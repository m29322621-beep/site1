{% extends "base.html" %}
{% block content %}
<h1>📝 Новая запись (Директор)</h1>
<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label>ФИО ученика <span class="required-star">*</span></label>
            <input type="text" name="student_name" required>
        </div>
        <div class="form-group">
            <label>Предмет <span class="required-star">*</span></label>
            <select name="subject" required>
                <option value="">— Выберите предмет —</option>
                <option value="Математика">Математика</option>
                <option value="Информатика">Информатика</option>
                <option value="Обществознание">Обществознание</option>
            </select>
        </div>
        <div class="form-group">
            <label>Дополнительная информация</label>
            <textarea name="additional_info"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Добавить запись</button>
    </form>
    <div style="text-align:center; margin-top:16px;">
        <a href="{{ url_for('director') }}" class="btn btn-secondary">← Назад</a>
    </div>
</div>
{% endblock %}
