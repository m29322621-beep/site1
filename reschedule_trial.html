{% extends "base.html" %}
{% block content %}

<h1>Перенос пробного занятия</h1>

<div class="form-card">
    <div class="info-panel">
        <div class="info-row"><span class="info-label">Ученик:</span> {{ trial[0] }}</div>
        <div class="info-row"><span class="info-label">Предмет:</span> {{ trial[1] }}</div>
        <div class="info-row"><span class="info-label">Текущая дата:</span> {{ trial[2] or 'Не указана' }}</div>
        <div class="info-row"><span class="info-label">Текущее время:</span> {{ trial[3] or 'Не указано' }}</div>
    </div>

    <form method="POST">
        <div class="form-group">
            <label for="scheduled_date">Новая дата занятия:</label>
            <input type="date" name="scheduled_date" id="scheduled_date" required
                   value="{{ trial[2] if trial[2] else '' }}">
        </div>

        <div class="form-group">
            <label for="scheduled_time">Новое время занятия:</label>
            <input type="time" name="scheduled_time" id="scheduled_time" required
                   value="{{ trial[3] if trial[3] else '' }}">
        </div>

        <button type="submit" class="btn btn-warning btn-block">Перенести</button>
    </form>
</div>

<div class="page-footer">
    <a href="{{ url_for('repetitor_trial_lessons') }}" class="btn btn-secondary">← Назад к пробным занятиям</a>
</div>

    <script>
        
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('scheduled_date').min = today;
    </script>
{% endblock %}
