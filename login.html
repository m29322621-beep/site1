{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; padding: 30px; background: white; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; margin-bottom: 30px;">вход в систему</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div style="background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ffeaa7;">
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Логин:</label>
            <input type="text" name="username" required
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;"
                   placeholder="Введите логин">
        </div>

        <div style="margin-bottom: 30px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Пароль:</label>
            <input type="password" name="password" required
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;"
                   placeholder="Введите пароль">
        </div>

        <button type="submit"
                style="width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;">
            Войти
        </button>
    </form>

    {% if error %}
    <div style="margin-top: 20px; padding: 10px; background: #f8d7da; color: #721c24; border-radius: 5px; border: 1px solid #f5c6cb;">
        {{ error }}
    </div>
    {% endif %}
</div>
{% endblock %}
