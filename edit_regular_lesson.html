{% extends "base.html" %}
{% block content %}
<h1>Редактирование занятия</h1>

<div class="form-card">
    <div class="info-panel">
        <div class="info-row"><span class="info-label">Ученик:</span> {{ lesson[1] }}</div>
        <div class="info-row"><span class="info-label">Предмет:</span> {{ lesson[4] }}</div>
    </div>

    <form method="POST">
        <div class="form-group">
            <label for="lesson_date">Дата занятия:</label>
            <input type="date" name="lesson_date" id="lesson_date" value="{{ lesson[2] }}" required>
        </div>
        <div class="form-group">
            <label for="lesson_time">Время занятия:</label>
            <input type="time" name="lesson_time" id="lesson_time" value="{{ lesson[3] }}" required>
        </div>
        <button type="submit" class="btn btn-success btn-block">Сохранить изменения</button>
    </form>
</div>

<div class="page-footer">
    <a href="{{ url_for('repetitor_regular_students_manage') }}" class="btn btn-secondary">← Назад</a>
</div>
{% endblock %}
