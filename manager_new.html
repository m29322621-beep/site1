{% extends "base.html" %}
{% block content %}
<h1>Новая запись</h1>

<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label for="student_name">ФИО ученика <span class="required-star">*</span></label>
            <input type="text" id="student_name" name="student_name" placeholder="Введите полное имя ученика" required>
        </div>

        <div class="form-group">
            <label>Предмет <span class="required-star">*</span></label>
            <div class="choice-grid">
                {% for subj in ['Математика', 'Информатика', 'Обществознание'] %}
                <label class="choice" for="subj_{{ loop.index }}">
                    <input type="radio" id="subj_{{ loop.index }}" name="subject" value="{{ subj }}" required>
                    <span>{{ subj }}</span>
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="form-group">
            <label for="additional_info">Дополнительная информация</label>
            <textarea id="additional_info" name="additional_info" placeholder="Пожелания, контакты, особенности..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Добавить запись</button>
    </form>

</div>

<div class="page-footer">
    <a href="{{ panel_url }}" class="btn btn-secondary">← Назад</a>
</div>
{% endblock %}
