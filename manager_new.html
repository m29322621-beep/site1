{% extends "base.html" %}
{% block content %}
<h1>➕ Новая запись</h1>

<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label for="student_name">ФИО ученика <span class="required-star">*</span></label>
            <input type="text" id="student_name" name="student_name" placeholder="Введите полное имя ученика" required>
        </div>

        <div class="form-group">
            <label>Предмет <span class="required-star">*</span></label>
            <div style="display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-top:6px;">
                {% for subj in ['Математика', 'Информатика', 'Обществознание'] %}
                <div style="position:relative;">
                    <input type="radio" id="subj_{{ loop.index }}" name="subject" value="{{ subj }}" class="subject-radio" required
                           style="position:absolute;opacity:0;width:0;height:0;">
                    <label for="subj_{{ loop.index }}" class="subject-label"
                           style="display:block;padding:12px 8px;border:2px solid #e0e0e0;border-radius:6px;text-align:center;cursor:pointer;transition:all 0.2s;font-weight:500;">
                        {{ subj }}
                    </label>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="form-group">
            <label for="additional_info">Дополнительная информация</label>
            <textarea id="additional_info" name="additional_info" placeholder="Пожелания, контакты, особенности..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:10px;">Добавить запись</button>
    </form>

    <div style="text-align:center; margin-top:18px;">
        {% if session.get('role') == 'senior_manager' %}
            <a href="{{ url_for('senior_manager') }}" class="btn btn-secondary">← Назад</a>
        {% else %}
            <a href="{{ url_for('manager') }}" class="btn btn-secondary">← Назад</a>
        {% endif %}
    </div>
</div>

<style>
.subject-radio:checked + .subject-label {
    border-color: #007bff !important;
    background: #f0f8ff;
    color: #007bff;
}
.subject-label:hover { border-color: #007bff !important; background: #f8f9fa; }
</style>
{% endblock %}
