
{% extends "base.html" %}
{% block content %}
<h1>Поменять репетитора у ученика</h1>

{% if students %}
<div class="form-card">
<form method="POST">
    <div class="form-group">
    <label>Выберите ученика:</label>
    <select name="student_id" required>
        {% for s in students %}
        <option value="{{ s[0] }}">{{ s[1] }} ({{ s[2] }}) — текущий: {{ s[3] }}</option>
        {% endfor %}
    </select>
    </div>

    <div class="form-group">
    <label>Выберите нового репетитора:</label>
    <select name="repetitor" required>
        {% for r in repetitors %}
        <option value="{{ r[0] }}">{{ r[0] }}</option>
        {% endfor %}
    </select>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Заменить</button>
</form>
</div>
{% else %}
<div class="empty-state"><p>Нет учеников с назначенными репетиторами.</p></div>
{% endif %}

<div class="page-footer">
    <a href="{{ panel_url }}" class="btn btn-secondary">← Назад</a>
</div>
{% endblock %}
