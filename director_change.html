
{% extends "base.html" %}
{% block content %}
<h2>Поменять репетитора у ученика</h2>

{% if students %}
<form method="POST">
    <label>Выберите ученика:</label>
    <select name="student_id" required>
        {% for s in students %}
        <option value="{{ s[0] }}">{{ s[1] }} ({{ s[2] }}) — текущий: {{ s[3] }}</option>
        {% endfor %}
    </select>
    <br><br>

    <label>Выберите нового репетитора:</label>
    <select name="repetitor" required>
        {% for r in repetitors %}
        <option value="{{ r[0] }}">{{ r[0] }}</option>
        {% endfor %}
    </select>
    <br><br>

    <button type="submit">Заменить</button>
</form>
{% else %}
<p>Нет учеников с назначенными репетиторами.</p>
{% endif %}

<p><a href="{{ url_for('director') }}">Назад</a></p>
{% endblock %}
