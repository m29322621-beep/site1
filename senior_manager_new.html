{% extends "base.html" %}
{% block content %}
<h1>Новые записи</h1>

    <div class="toolbar"><form method="POST">
        <button type="submit" name="clear" value="1" class="btn btn-success">Отметить все как просмотренные</button>
    </form></div>

    {% if records %}
        <div class="table-wrap">
        <table class="data-table">
            <thead><tr>
                <th>ID</th>
                <th>Менеджер</th>
                <th>Ученик</th>
                <th>Предмет</th>
                <th>Дата отправки</th>
            </tr></thead>
            <tbody>
            {% for r in records %}
            <tr>
                <td>{{ r[0] }}</td>
                <td>{{ r[1] }}</td>
                <td>{{ r[2] }}</td>
                <td>{{ r[3] }}</td>
                <td>{{ r[4] }}</td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
        </div>
    {% else %}
        <div class="empty-state"><p>Нет новых записей.</p></div>
    {% endif %}

    <div class="page-footer"><a href="{{ panel_url }}" class="btn btn-secondary">← Назад</a></div>
{% endblock %}
