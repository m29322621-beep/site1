
{% extends "base.html" %}
{% block content %}
<h1>Мои ученики</h1>

{% if students %}
<table class="data-table">
    <thead>
        <tr><th>ФИО ученика</th><th>Предмет</th><th>Менеджер</th><th>Дата записи</th></tr>
    </thead>
    <tbody>
    {% for s in students %}
    <tr>
        <td>{{ s[0] }}</td>
        <td>{{ s[1] }}</td>
        <td>{{ s[2] }}</td>
        <td>{{ s[3] }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% else %}
<div class="empty-state">
    <p>У вас пока нет закреплённых учеников.</p>
</div>
{% endif %}

<div class="page-footer"><a href="{{ url_for('repetitor_main') }}" class="btn btn-secondary">← Назад</a></div>
{% endblock %}
