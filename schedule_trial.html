{% extends "base.html" %}
{% block content %}

<style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #007bff;
        }
    </style>
<h2>Назначение пробного занятия</h2>

    <p><strong>Ученик:</strong> {{ trial[0] }}</p>
    <p><strong>Предмет:</strong> {{ trial[1] }}</p>

    <form method="POST">
        <div class="form-group">
            <label for="scheduled_date">Дата занятия:</label>
            <input type="date" name="scheduled_date" id="scheduled_date" required>
        </div>

        <div class="form-group">
            <label for="scheduled_time">Время занятия:</label>
            <input type="time" name="scheduled_time" id="scheduled_time" required>
        </div>

        <button type="submit">Назначить</button>
    </form>

    <a href="{{ url_for('repetitor_trial_lessons') }}" class="back-link">Назад к пробным занятиям</a>

    <script>
        
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('scheduled_date').min = today;
    </script>
{% endblock %}
